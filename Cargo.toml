[package]
name = "mxm"
version = "0.6.1"
edition = "2024"
description = "CLI and daemon for configuring Logitech MX Master mice, with Options+-style scrolling on macOS"
license = "MIT"
repository = "https://github.com/p-chan/mxm"
publish = false

[[bin]]
name = "mxm"
path = "src/main.rs"

[package.metadata.dist]
# Not published to crates.io, but released as binaries
dist = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
