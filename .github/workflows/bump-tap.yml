# Called by the release workflow after the release is announced. It asks the
# Homebrew tap to bump its casks now, instead of waiting for its schedule.
name: Bump Homebrew tap

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  # To send it again by hand, e.g. when the tap missed it
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-slim
    steps:
      - name: Create a token for the tap
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: p-chan
          repositories: homebrew-tap
          permission-contents: write

      - name: Send repository_dispatch to the tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/p-chan/homebrew-tap/dispatches -f event_type=bump
