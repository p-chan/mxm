[workspace]
# Not published to crates.io: determine the current version from git tags
git_only = true
git_tag_name = "v{{ version }}"
# dist creates the GitHub Release with the binaries
git_release_enable = false
changelog_path = "./CHANGELOG.md"
# Release only when the release PR is merged, not whenever the version in Cargo.toml changes
release_always = false
# Open a release PR only for user-facing changes (feat / fix, including breaking ones).
# Other commits are still listed in the changelog of the next release.
release_commits = "^(feat|fix)(\\(.+\\))?!?:"
# Bump the minor version for features even in 0.x, so the version tells features from fixes.
# mxm is a binary nobody depends on, so Cargo's 0.x compatibility rule does not matter.
features_always_increment_minor = true

# The default template of release-plz, except that the heading is `v<version>` without a date.
# dist uses the heading as the title of the GitHub Release, so it matches the tag.
[changelog]
body = """

## [v{{ version }}]\
    {%- if release_link -%}\
        ({{ release_link }})\
    {% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

    {% for commit in commits %}
        {%- if commit.scope -%}
            - *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}\
                {{ commit.message }}\
                {%- if commit.links %} \
                    ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%})\
                {% endif %}
        {% else -%}
            - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
        {% endif -%}
    {% endfor -%}
{% endfor %}
"""
commit_parsers = [
  { message = "^feat", group = "added" },
  { message = "^changed", group = "changed" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = "^.*", group = "other" },
]
